services:
  # pgTAP permission-matrix suite. Two services mirror the harness + agent-init
  # pattern: test-db is a throwaway Postgres (schema auto-loaded on first boot),
  # and pgtap is a one-shot runner that loads helpers/fixtures and runs pg_prove.
  # Neither touches the live harness. Exits non-zero on any failing assertion.
  #   docker compose -f docker-compose.test.yml run --rm pgtap
  test-db:
    build:
      context: .
      target: pgtap
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  pgtap:
    build:
      context: .
      target: pgtap
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      PGHOST: test-db
      PGUSER: postgres
      PGPASSWORD: postgres
    restart: "no"
    volumes:
      - ./tests:/tests:ro
    working_dir: /tests
    command:
      - ./run.sh
