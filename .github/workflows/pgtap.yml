name: pgtap

# Runs the pgTAP RBAC/RLS permission-matrix suite in tests/pgtap/. The suite
# pins down the entire permission matrix enforced by the harness init SQL
# (40-attobot-rbac.sql, 41-dashboard-role.sql), so it gates every change to the
# database schema or roles.
#
# Everything runs inside Docker via docker-compose.test.yml:
#   - test-db: throwaway Postgres built from harness/Dockerfile (target: pgtap),
#     which auto-loads the project schema on first boot.
#   - pgtap:   one-shot runner that loads helpers/fixtures (tests/run.sh) and
#     runs pg_prove against test-db. It never touches the live harness DB.
# pg_prove exits non-zero on the first failing assertion, failing the job.

on:
  push:
    branches: [develop, master]
    paths:
      - "harness/docker-entrypoint-initdb.d/**"
      - "harness/Dockerfile"
      - "tests/**"
      - "docker-compose.test.yml"
      - ".github/workflows/pgtap.yml"
  pull_request:
    paths:
      - "harness/docker-entrypoint-initdb.d/**"
      - "harness/Dockerfile"
      - "tests/**"
      - "docker-compose.test.yml"
      - ".github/workflows/pgtap.yml"
  workflow_dispatch:

concurrency:
  group: pgtap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: pgTAP permission-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Use a buildx docker-container driver so the build step can read/write the
      # GitHub Actions cache (the default "docker" driver can't).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the pgtap image (harness/Dockerfile target: pgtap) with GHA layer
      # caching. The base harness stage downloads + SHA-verifies three extension
      # .debs from GitHub releases and the pgtap stage pulls pgTAP + pg_prove
      # from the PG apt repo, so caching those layers keeps reruns fast.
      - name: Build test image
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: |
          docker compose -f docker-compose.test.yml build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max

      # `run --rm -T pgtap` starts test-db (the depends_on healthcheck gates
      # until the schema is loaded), then runs tests/run.sh against it. -T
      # disables TTY allocation (CI has none). The container's exit code is the
      # suite result, so a failing assertion fails the step.
      - name: Run pgTAP suite
        run: docker compose -f docker-compose.test.yml run --rm -T pgtap
