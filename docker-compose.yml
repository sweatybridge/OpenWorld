services:
  harness:
    build:
      context: ./harness
      target: harness
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - attobot_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  agent-init:
    image: postgres:18-trixie
    depends_on:
      harness:
        condition: service_healthy
    restart: no
    environment:
      PGHOST: harness
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./agents.sql:/attobot/agents.sql:ro
      - authorized_keys:/root/.ssh:rw
    command:
      - psql
      - --no-psqlrc
      - --single-transaction
      - --set=ON_ERROR_STOP=1
      - --set=api_key=${ATTOBOT_API_KEY:-}
      - --set=exa_api_key=${ATTOBOT_EXA_API_KEY:-}
      - --set=model=${ATTOBOT_MODEL:-deepseek-v4-pro}
      - --set=api_base=${ATTOBOT_API_BASE:-https://api.deepseek.com/v1}
      - --set=temperature=${ATTOBOT_TEMPERATURE:-1.0}
      - --set=reasoning_effort=${ATTOBOT_REASONING_EFFORT:-medium}
      - --set=context_tokens=${ATTOBOT_CONTEXT_TOKENS:-1000000}
      - --set=multimodal_support=${ATTOBOT_MULTIMODAL_SUPPORT:-false}
      - --set=telegram_token=${ATTOBOT_TELEGRAM_TOKEN:-}
      - --set=telegram_chat_id=${ATTOBOT_TELEGRAM_CHAT_ID:-}
      - --set=telegram_thread_id=${ATTOBOT_TELEGRAM_THREAD_ID:-}
      - --set=telegram_api_base=${ATTOBOT_TELEGRAM_API_BASE:-https://api.telegram.org}
      - --set=telegram_poll_timeout=${ATTOBOT_TELEGRAM_POLL_TIMEOUT:-60}
      - --set=dashboard_db_password=${ATTOBOT_DASHBOARD_DB_PASSWORD:-dashboard}
      - --set=ssh_host=${ATTOBOT_SSH_HOST:-}
      - --set=ssh_port=${ATTOBOT_SSH_PORT:-22}
      - --set=ssh_user=${ATTOBOT_SSH_USER:-}
      - --set=ssh_host_name=${ATTOBOT_SSH_HOST_NAME:-default}
      - --set=ssh_fp=${ATTOBOT_SSH_HOST_KEY_FINGERPRINT:-}
      - --file=/attobot/agents.sql
      - --quiet

  # Read-only admin dashboard for pg_durable workflows + attobot domain.
  # View-only: the attobot_dashboard DB role has only SELECT/EXECUTE grants, so
  # writes fail at the database even if the API layer had a bug.
  dashboard:
    build:
      context: ./dashboard
    depends_on:
      harness:
        condition: service_healthy
      agent-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PGHOST: harness
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: attobot_dashboard
      PGPASSWORD: ${ATTOBOT_DASHBOARD_DB_PASSWORD:-dashboard}
      PORT: 8088
      # Set ATTOBOT_DASHBOARD_TOKEN to require `Authorization: Bearer <token>`.
      # The port is published on all interfaces (0.0.0.0) so mobile clients on the
      # LAN — or over Tailscale — can reach it. Strongly set a token when exposing.
      DASHBOARD_TOKEN: ${ATTOBOT_DASHBOARD_TOKEN:-}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sshd:
    image: lscr.io/linuxserver/openssh-server:latest
    depends_on:
      harness:
        condition: service_healthy
      agent-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=attobot
      - PUBLIC_KEY_DIR=/etc/authorized_keys
    volumes:
      - authorized_keys:/etc/authorized_keys:ro
    ports:
      - "2222:2222"

volumes:
  attobot_pgdata:
  authorized_keys:
