services:
  harness:
    build:
      context: ./harness
      target: harness
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${OPENWORLD_POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - harness_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  agent-init:
    image: postgres:18-trixie
    depends_on:
      harness:
        condition: service_healthy
    restart: no
    environment:
      PGHOST: harness
      PGUSER: postgres
      PGPASSWORD: ${OPENWORLD_POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./agents.sql:/ow/agents.sql:ro
      - authorized_keys:/root/.ssh:rw
    command:
      - psql
      - --no-psqlrc
      - --single-transaction
      - --set=ON_ERROR_STOP=1
      - --set=api_key=${OPENWORLD_API_KEY:-}
      - --set=exa_api_key=${OPENWORLD_EXA_API_KEY:-}
      - --set=sdcpp_api_base=${OPENWORLD_SDCPP_API_BASE:-}
      - --set=sdcpp_api_key=${OPENWORLD_SDCPP_API_KEY:-}
      - --set=model=${OPENWORLD_MODEL:-Gemma4-26B-A4B}
      - --set=api_base=${OPENWORLD_API_BASE:-http://localhost:11434/v1}
      - --set=temperature=${OPENWORLD_TEMPERATURE:-1.0}
      - --set=reasoning_effort=${OPENWORLD_REASONING_EFFORT:-medium}
      - --set=context_tokens=${OPENWORLD_CONTEXT_TOKENS:-131072}
      - --set=multimodal_support=${OPENWORLD_MULTIMODAL_SUPPORT:-true}
      - --set=telegram_token=${OPENWORLD_TELEGRAM_TOKEN:-}
      - --set=telegram_chat_id=${OPENWORLD_TELEGRAM_CHAT_ID:-}
      - --set=telegram_thread_id=${OPENWORLD_TELEGRAM_THREAD_ID:-}
      - --set=telegram_api_base=${OPENWORLD_TELEGRAM_API_BASE:-https://api.telegram.org}
      - --set=telegram_poll_timeout=${OPENWORLD_TELEGRAM_POLL_TIMEOUT:-60}
      - --set=dashboard_db_password=${OPENWORLD_DASHBOARD_PASSWORD:-dashboard}
      - --set=ssh_host=${OPENWORLD_SSH_HOST:-sshd}
      - --set=ssh_port=${OPENWORLD_SSH_PORT:-2222}
      - --set=ssh_user=${OPENWORLD_SSH_USER:-ow}
      - --set=ssh_host_name=${OPENWORLD_SSH_HOST_NAME:-default}
      - --set=ssh_fp=${OPENWORLD_SSH_HOST_KEY_FINGERPRINT:-}
      - --file=/ow/agents.sql
      - --quiet

  # Read-only admin dashboard for pg_durable workflows + ow domain.
  # View-only: the ow_dashboard DB role has only SELECT/EXECUTE grants, so
  # writes fail at the database even if the API layer had a bug.
  dashboard:
    build:
      context: ./dashboard
    depends_on:
      harness:
        condition: service_healthy
      agent-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PGHOST: harness
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: ow_dashboard
      PGPASSWORD: ${OPENWORLD_DASHBOARD_PASSWORD:-dashboard}
      PORT: 8088
      # Set OPENWORLD_DASHBOARD_TOKEN to require `Authorization: Bearer ***
      # The port is published on all interfaces (0.0.0.0) so mobile clients on the
      # LAN — or over Tailscale — can reach it. Strongly set a token when exposing.
      DASHBOARD_TOKEN: ${OPENWORLD_DASHBOARD_TOKEN:-}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sshd:
    image: lscr.io/linuxserver/openssh-server:latest
    depends_on:
      harness:
        condition: service_healthy
      agent-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=${OPENWORLD_SSH_USER:-ow}
      - PUBLIC_KEY_DIR=/etc/authorized_keys
    volumes:
      - authorized_keys:/etc/authorized_keys:ro
    ports:
      - "2222:2222"

volumes:
  harness_pgdata:
  authorized_keys:
